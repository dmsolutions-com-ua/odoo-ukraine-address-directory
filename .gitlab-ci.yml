image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-simple

variables:
    GIT_STRATEGY: clone
    SERIES_BRANCH: '18.0'
    ODOO_ADMIN_PASS: admin
    CI_JOB_TOKEN_GIT_HOST: 'gitlab.crnd.pro'
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.hidden-pip-cache"

.only-stable-branch: &only_stable_branch
    only:
        - "18.0"

.only-dev-branch: &only_dev_branch
    only:
        - /^18.0-.*$/

.except-auto-commits: &except_auto_commits
    except:
        variables:
            - $CI_COMMIT_MESSAGE =~ /\[CI-AUTO-UPDATE\]/
            - $CI_COMMIT_MESSAGE =~ /Translated using Weblate/

# Disable global cache
cache: {}

.pip_cache: &pip_cache_definition
    cache:
        key: ${CI_JOB_NAME}
        paths:
            - "${PIP_CACHE_DIR}"

stages:
    - static-test
    - test
    - deploy

build_env:
    stage: static-test
    script:
        - pwd
        - whoami
        - python3 --version
        - odoo-helper --version
        - odoo-helper status --tools-versions --ci-tools-versions
        - echo "Checking branch compatability $CI_COMMIT_BRANCH" && [[ "$CI_COMMIT_BRANCH" =~ ^18.0(-.*)?$ ]]

flake8:
    stage: static-test
    script:
        - odoo-helper lint flake8 .
    allow_failure: true
    <<: *except_auto_commits

pylint:
    stage: static-test
    script:
        - odoo-helper lint pylint .
    allow_failure: true
    <<: *except_auto_commits

stylelint:
    stage: static-test
    script:
        - odoo-helper lint style .
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits

bandit:
    stage: static-test
    <<: *pip_cache_definition
    before_script:
        - odoo-helper pip install bandit
    script:
        - odoo-helper exec bandit -r .
    allow_failure: true
    <<: *except_auto_commits

check-versions:
    stage: static-test
    script:
        - odoo-helper ci check-versions-git . origin/$SERIES_BRANCH $CI_COMMIT_SHA
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits

ensure-changelog:
    stage: static-test
    script:
        - odoo-helper ci ensure-changelog --format md . origin/$SERIES_BRANCH $CI_COMMIT_SHA
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits

ensure-icons:
    stage: static-test
    script:
        - odoo-helper ci ensure-icons .
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits


tests:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    variables:
        GIT_STRATEGY: clone
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odoo-helper link .
    script:
        - odoo-helper --use-unbuffer test --coverage --coverage-report --coverage-skip-covered --coverage-fail-under 30 --create-test-db --dir .
    <<: *except_auto_commits
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
        - /tmp/odoo_tests/

migration_tests:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    variables:
        GIT_STRATEGY: clone
        ODOO_DB_NAME: test-db
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - git fetch origin $SERIES_BRANCH
        - git checkout $SERIES_BRANCH
        - git pull
        - odoo-helper link .
        - odoo-helper --use-unbuffer db create --demo $ODOO_DB_NAME
        - odoo-helper --use-unbuffer addons install --db $ODOO_DB_NAME --dir .
        - git checkout $CI_COMMIT_SHA
        - git clean -fdx
        - odoo-helper link .
        - odoo-helper --use-unbuffer addons update-list
        - odoo-helper --use-unbuffer addons update --db $ODOO_DB_NAME --dir .
    script:
        - odoo-helper --use-unbuffer test --coverage --coverage-report --coverage-skip-covered --coverage-fail-under 30 --dir .
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    <<: *only_dev_branch
    <<: *except_auto_commits
    allow_failure: true
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
        - /tmp/odoo_tests/


tests_odood:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    variables:
        GIT_STRATEGY: clone
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - google-chrome --version
        - odood --version
    script:
        - odood test -t --isw --error-report --coverage --coverage-report --coverage-skip-covered --dir-r . | tail -n 1000
    <<: *except_auto_commits
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
        - /tmp/odoo_tests/

test_odood_installation_no_demo:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    variables:
        GIT_STRATEGY: clone
        ODOO_DB_NAME: test-db-clean
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - odood db create $ODOO_DB_NAME

    script:
        - odood addons install --db "$ODOO_DB_NAME" --dir-r .
    <<: *except_auto_commits

migration_tests_odood:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    variables:
        GIT_STRATEGY: clone
        ODOO_DB_NAME: test-db
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - google-chrome --version
        - odood --version
    script:
        - odood test -t --migration --isw --error-report --coverage --coverage-report --coverage-skip-covered --coverage-fail-under=10 --dir-r . | tail -n 1000
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    <<: *only_dev_branch
    <<: *except_auto_commits
    allow_failure: true
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
        - /tmp/odoo_tests/
